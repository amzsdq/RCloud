name: runtime-evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'wrangler.jsonc'
      - 'control/mailbox.json'
      - '.github/workflows/runtime-evidence.yml'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: rcloud-runtime-evidence
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe deployed read-only runtime
        shell: bash
        env:
          BASE_URL: https://rcloud.amzsdq.workers.dev
          RAW_MAILBOX: https://raw.githubusercontent.com/amzsdq/RCloud/main/control/mailbox.json
        run: |
          set -euo pipefail
          mkdir -p evidence

          retry_get() {
            local path="$1" out="$2"
            for attempt in 1 2 3; do
              if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
                -H 'cache-control: no-cache' "$BASE_URL$path" -o "$out"; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          retry_get /health evidence/health.json
          retry_get /loop/status evidence/loop-status.json

          # For mailbox-changing pushes, wait until the deployed cron has observed
          # the current mailbox request. This converts a race-prone snapshot into
          # durable execution evidence without exposing a mutating HTTP endpoint.
          curl --fail --silent --show-error -H 'cache-control: no-cache' "$RAW_MAILBOX" -o evidence/expected-mailbox.json
          expected_id="$(python -c 'import json; print(json.load(open("evidence/expected-mailbox.json")).get("request_id", ""))')"
          expected_issued_at="$(python -c 'import json; print(json.load(open("evidence/expected-mailbox.json")).get("issued_at", ""))')"
          expected_fingerprint="$(node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const c = JSON.parse(fs.readFileSync('evidence/expected-mailbox.json', 'utf8'));
          const stable = JSON.stringify({
            schema_version: c?.schema_version,
            request_id: c?.request_id,
            action: c?.action,
            payload: c?.payload ?? null
          });
          process.stdout.write(crypto.createHash('sha256').update(stable).digest('hex'));
          NODE
          )"

          matched=false
          for attempt in 1 2 3 4 5 6 7; do
            retry_get /mailbox/status evidence/mailbox-status.json
            if EXPECTED_ID="$expected_id" EXPECTED_FP="$expected_fingerprint" EXPECTED_ISSUED_AT="$expected_issued_at" python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path

          def dt(value):
              if not value:
                  return None
              return datetime.fromisoformat(str(value).replace('Z', '+00:00'))

          m = json.loads(Path('evidence/mailbox-status.json').read_text())
          expected_id = os.environ.get('EXPECTED_ID', '')
          expected_fp = os.environ.get('EXPECTED_FP', '')
          issued_at = dt(os.environ.get('EXPECTED_ISSUED_AT', ''))

          ledger = {str(x.get('request_id', '')): x for x in (m.get('recent_ledger') or [])}
          entry = ledger.get(expected_id)
          poll = m.get('last_poll') or {}
          receipt = m.get('receipt') or {}

          if not expected_id or not expected_fp or not entry:
              raise SystemExit(1)
          if str(poll.get('request_id', '')) != expected_id:
              raise SystemExit(1)
          poll_finished = dt(poll.get('finished_at'))
          if issued_at and (not poll_finished or poll_finished < issued_at):
              raise SystemExit(1)

          ledger_fp = str(entry.get('fingerprint', ''))
          if ledger_fp == expected_fp:
              # If the retained execution predates this mailbox issuance, this
              # observation must be a DUPLICATE, not merely an old ledger hit.
              started_at = dt(entry.get('started_at'))
              if issued_at and started_at and started_at < issued_at:
                  ok = poll.get('receipt_status') == 'DUPLICATE'
              else:
                  ok = poll.get('receipt_status') in ('COMPLETED', 'DUPLICATE')
          else:
              # Reusing an existing request_id with a different command must
              # produce an explicit collision receipt for the new fingerprint.
              ok = (
                  poll.get('receipt_status') == 'REJECTED'
                  and receipt.get('request_id') == expected_id
                  and receipt.get('status') == 'REJECTED'
                  and receipt.get('error') == 'REQUEST_ID_COLLISION'
                  and str(receipt.get('expected_fingerprint', '')) == ledger_fp
                  and str(receipt.get('received_fingerprint', '')) == expected_fp
              )

          raise SystemExit(0 if ok else 1)
          PY
            then
              matched=true
              break
            fi
            sleep 10
          done

          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('evidence/health.json').read_text())
          loop = json.loads(Path('evidence/loop-status.json').read_text())
          mailbox = json.loads(Path('evidence/mailbox-status.json').read_text())

          assert health.get('ok') is True, health
          version = str(health.get('version', ''))
          assert version, health

          fires = loop.get('recent_alarm_fires') or []
          loop_pass = bool(loop.get('verified_two_plus_fires')) and len(fires) >= 2

          receipts = mailbox.get('recent_receipts') or []
          receipt = mailbox.get('receipt')
          if receipt:
            receipts = receipts + [receipt]
          ai_receipts = [r for r in receipts if r.get('request_id') == 'AI-CANARY-001']
          ai_pass = any(
              r.get('ok') is True
              and r.get('action') == 'AI_PROMPT'
              and 'RCLOUD_AI_ALIVE' in str((r.get('result') or {}).get('output', ''))
              for r in ai_receipts
          )

          report = {
              'runtime_reachable': True,
              'version': version,
              'loop_two_plus_pass': loop_pass,
              'loop_fire_count_observed': len(fires),
              'ai_canary_pass': ai_pass,
              'ai_canary_receipts_observed': len(ai_receipts),
              'ledger_size': mailbox.get('ledger_size'),
              'last_poll': mailbox.get('last_poll'),
          }
          Path('evidence/summary.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY

          printf '{"expected_request_id":"%s","expected_fingerprint":"%s","expected_issued_at":"%s","matched":%s}\n' \
            "$expected_id" "$expected_fingerprint" "$expected_issued_at" "$matched" > evidence/mailbox-wait.json
          test "$matched" = true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
