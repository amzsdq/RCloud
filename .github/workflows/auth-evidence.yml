name: auth-evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'control/mailbox.json'
      - '.github/workflows/auth-evidence.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Browser Run auth canary
        shell: bash
        env:
          BASE_URL: https://rcloud.amzsdq.workers.dev
          EXPECTED_ID: BROWSER-AUTH-START-RETRY-002
        run: |
          set -euo pipefail
          mkdir -p evidence
          terminal=false
          for attempt in $(seq 1 18); do
            curl --fail --silent --show-error --connect-timeout 10 --max-time 20               -H 'cache-control: no-cache' "$BASE_URL/health?cb=$GITHUB_RUN_ID-$attempt"               -o evidence/health.json || true
            curl --fail --silent --show-error --connect-timeout 10 --max-time 20               -H 'cache-control: no-cache' "$BASE_URL/auth/status?cb=$GITHUB_RUN_ID-$attempt"               -o evidence/auth-status.json || true
            curl --fail --silent --show-error --connect-timeout 10 --max-time 20               -H 'cache-control: no-cache' "$BASE_URL/mailbox/status?cb=$GITHUB_RUN_ID-$attempt"               -o evidence/mailbox-status.json || true

            if EXPECTED_ID="$EXPECTED_ID" python - <<'PY'
          import json, os
          from pathlib import Path
          try:
              h=json.loads(Path('evidence/health.json').read_text())
              a=json.loads(Path('evidence/auth-status.json').read_text())
              m=json.loads(Path('evidence/mailbox-status.json').read_text())
          except Exception:
              raise SystemExit(1)
          if h.get('version') != '0.14.2':
              raise SystemExit(1)
          rid=os.environ['EXPECTED_ID']
          receipts=list(m.get('recent_receipts') or [])
          if m.get('receipt'):
              receipts.append(m['receipt'])
          matches=[r for r in receipts if r.get('request_id') == rid]
          if not matches:
              raise SystemExit(1)
          r=matches[-1]
          Path('evidence/summary.json').write_text(json.dumps({
              'version': h.get('version'),
              'request_id': rid,
              'receipt_status': r.get('status'),
              'receipt_ok': r.get('ok'),
              'receipt_error': r.get('error'),
              'auth_phase': a.get('phase'),
              'auth_target': a.get('target'),
              'keep_alive_seconds': a.get('keep_alive_seconds')
          }, indent=2) + '\n')
          raise SystemExit(0 if r.get('status') in ('COMPLETED','FAILED_AMBIGUOUS','REJECTED') else 1)
          PY
            then
              terminal=true
              break
            fi
            sleep 5
          done
          cat evidence/summary.json || true
          test "$terminal" = true

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 1
